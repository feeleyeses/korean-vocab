name: Deploy Korean Word Field

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: korean-vocab-pages
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit vocabulary data
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit-vocab.py | tee vocab-audit.md
          cat vocab-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'scripts' \
            --exclude 'docs'
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              '"/assets/': '"assets/',
              "'/assets/": "'assets/",
              '\\"/assets/': '\\"assets/',
              "\\'/assets/": "\\'assets/",
              'import("/assets/': 'import("./assets/',
              "import('/assets/": "import('./assets/",
              'import("assets/': 'import("./assets/',
              "import('assets/": "import('./assets/",
              'href="/favicon.svg"': 'href="favicon.svg"',
              "href='/favicon.svg'": "href='favicon.svg'",
              '\\"href\\":\\"/favicon.svg\\"': '\\"href\\":\\"favicon.svg\\"',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          s = re.sub(
              r'<script>\(function\(\)\{function c\(\).*?/cdn-cgi/challenge-platform/scripts/jsd/main\.js.*?</script>',
              '',
              s,
              flags=re.S,
          )

          css_tags = [
              '<link rel="stylesheet" href="assets/stabilize.css" data-kwf-stabilize="true"/>',
              '<link rel="stylesheet" href="assets/study-card-v2.css" data-kwf-study-card-v2="true"/>',
              '<link rel="stylesheet" href="assets/layout-v2.css" data-kwf-layout-v2="true"/>',
          ]
          for tag in css_tags:
              marker = tag.split(' data-')[1].split('=')[0]
              if marker not in s:
                  s = s.replace('</head>', tag + '</head>')

          scripts = [
              '<script type="module" src="assets/study-card-v2.js" data-kwf-study-card-v2-js="true"></script>',
              '<script type="module" src="assets/layout-v2.js" data-kwf-layout-v2-js="true"></script>',
          ]
          for script in scripts:
              marker = script.split(' data-')[1].split('=')[0]
              if marker not in s:
                  s = s.replace('</body>', script + '</body>')

          p.write_text(s, encoding='utf-8')

          # Vinext/Vite lazy dependency maps contain generated `assets/foo.js`
          # strings. On Project Pages the runtime resolved those against the host
          # root. Scope generated dependency strings to /korean-vocab/assets/.
          for js in Path('_site/assets').glob('*.js'):
              body = js.read_text(encoding='utf-8')
              for old, new in (
                  ('"/assets/', '"/korean-vocab/assets/'),
                  ("'/assets/", "'/korean-vocab/assets/"),
                  ('`/assets/', '`/korean-vocab/assets/'),
                  ('"assets/', '"/korean-vocab/assets/'),
                  ("'assets/", "'/korean-vocab/assets/"),
                  ('`assets/', '`/korean-vocab/assets/'),
              ):
                  body = body.replace(old, new)
              js.write_text(body, encoding='utf-8')
          PY
          touch _site/.nojekyll
          grep -q 'data-kwf-layout-v2' _site/index.html
          grep -q 'data-kwf-layout-v2-js' _site/index.html
          grep -q 'import("./assets/index-' _site/index.html
          ! grep -q '/cdn-cgi/challenge-platform/' _site/index.html
          test -f _site/assets/layout-v2.css
          test -f _site/assets/layout-v2.js
          grep -R -q '/korean-vocab/assets/' _site/assets/index-*.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-check:
    needs: build-and-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm public assets respond
        shell: bash
        run: |
          set -euo pipefail
          base='https://feeleyeses.github.io/korean-vocab/'
          html=/tmp/kwf.html
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "$base" -o "$html" && grep -q '韩语词场' "$html"; then break; fi
            sleep 10
          done
          grep -q '韩语词场' "$html"
          grep -q 'data-kwf-layout-v2-js' "$html"
          asset=$(grep -o 'import("\./assets/index-[^"]*' "$html" | head -1 | sed 's/import("\.\///')
          test -n "$asset"
          curl -fsSL "${base}${asset}" >/dev/null
          curl -fsSL "${base}assets/layout-v2.css" >/dev/null
          curl -fsSL "${base}assets/layout-v2.js" >/dev/null
          curl -fsSL "${base}data/enrichment.json" >/dev/null

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps

      - name: Browser interaction smoke test
        env:
          KWF_URL: https://feeleyeses.github.io/korean-vocab/
        run: node scripts/browser-smoke.mjs
