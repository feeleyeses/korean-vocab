name: Deploy Korean Word Field
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: korean-vocab-pages
  cancel-in-progress: true
jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Audit vocabulary data
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit-vocab.py | tee vocab-audit.md
          cat vocab-audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Build static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'scripts' --exclude 'docs'
          touch _site/.nojekyll
          grep -q 'assets/app.css' _site/index.html
          grep -q 'assets/app.js' _site/index.html
          test -f _site/assets/app.css
          test -f _site/assets/app.js
          test -f _site/data/vocabulary.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
  smoke-check:
    needs: build-and-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Confirm public assets respond
        shell: bash
        run: |
          set -euo pipefail
          base='https://feeleyeses.github.io/korean-vocab/'; html=/tmp/kwf.html
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "$base" -o "$html" && grep -q '韩语词场' "$html" && grep -q 'assets/app.js' "$html"; then break; fi
            sleep 10
          done
          grep -q 'assets/app.js' "$html"
          curl -fsSL "${base}assets/app.js" >/dev/null
          curl -fsSL "${base}data/vocabulary.json" >/dev/null
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: D2 interaction and geometry smoke
        env: { KWF_URL: 'https://feeleyeses.github.io/korean-vocab/' }
        run: node scripts/d2-ui-smoke.mjs
