name: Deploy Korean Word Field

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: korean-vocab-pages
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit vocabulary data
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit-vocab.py | tee vocab-audit.md
          cat vocab-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'scripts' \
            --exclude 'docs'
          python - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')

          # The mirrored vinext page was built for a domain root. GitHub project
          # Pages lives under /korean-vocab/, so root-absolute app assets break
          # hydration and leave SSR buttons inert. Make all app-owned root paths
          # project-relative at deploy time instead of mutating the mirrored source.
          replacements = {
              '"/assets/': '"assets/',
              "'/assets/": "'assets/",
              'import("/assets/': 'import("assets/',
              "import('/assets/": "import('assets/",
              'href="/favicon.svg"': 'href="favicon.svg"',
              "href='/favicon.svg'": "href='favicon.svg'",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          css_tags = [
              '<link rel="stylesheet" href="assets/stabilize.css" data-kwf-stabilize="true"/>',
              '<link rel="stylesheet" href="assets/study-card-v2.css" data-kwf-study-card-v2="true"/>',
          ]
          for tag in css_tags:
              if tag.split(' data-')[1].split('=')[0] not in s:
                  s = s.replace('</head>', tag + '</head>')

          enhancement = '<script type="module" src="assets/study-card-v2.js" data-kwf-study-card-v2-js="true"></script>'
          if 'data-kwf-study-card-v2-js' not in s:
              s = s.replace('</body>', enhancement + '</body>')

          p.write_text(s, encoding='utf-8')
          PY
          touch _site/.nojekyll
          grep -q 'data-kwf-stabilize' _site/index.html
          grep -q 'data-kwf-study-card-v2' _site/index.html
          grep -q 'import("assets/index-' _site/index.html
          ! grep -q 'import("/assets/index-' _site/index.html
          test -f _site/assets/stabilize.css
          test -f _site/assets/study-card-v2.css
          test -f _site/assets/study-card-v2.js
          test -f _site/data/enrichment.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-check:
    needs: build-and-audit
    runs-on: ubuntu-latest
    steps:
      - name: Confirm public app and runtime assets respond
        shell: bash
        run: |
          set -euo pipefail
          base='https://feeleyeses.github.io/korean-vocab/'
          html=/tmp/kwf.html
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "$base" -o "$html" && grep -q '韩语词场' "$html"; then
              break
            fi
            sleep 10
          done
          grep -q '韩语词场' "$html"
          grep -q 'data-kwf-study-card-v2-js' "$html"
          asset=$(grep -o 'import("assets/index-[^"]*' "$html" | head -1 | sed 's/import("//')
          test -n "$asset"
          curl -fsSL "${base}${asset}" >/dev/null
          curl -fsSL "${base}assets/study-card-v2.js" >/dev/null
          curl -fsSL "${base}data/enrichment.json" >/dev/null
          echo "Pages runtime smoke check passed: ${base}${asset}"
