name: Mirror deployed Korean Word Field

on:
  push:
    branches: [main]
    paths:
      - '.mirror-trigger'
      - '.github/workflows/mirror-site.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: korean-vocab-mirror
  cancel-in-progress: false

jobs:
  mirror-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mirror deployed site
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/korean-word-field
          mkdir -p /tmp/korean-word-field
          wget \
            --mirror \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-parent \
            --no-host-directories \
            --directory-prefix=/tmp/korean-word-field \
            --execute robots=off \
            'https://korean-word-field.forluv117.chatgpt.site/'
          test -f /tmp/korean-word-field/index.html
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/korean-word-field/. .
          touch .nojekyll

      - name: Commit mirrored source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: mirror deployed Korean Word Field'
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
