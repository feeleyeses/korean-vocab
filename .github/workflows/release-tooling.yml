name: Release tooling verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frozen-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify explicit collocation cleanup and unchanged historical A/B gates
        run: node docs/collocation/cleanup-ci.mjs
      - name: Production and frozen artifact files are unchanged
        run: git diff --exit-code -- data/vocabulary.json docs/review-tool/release-a-manifest.json docs/review-tool/RELEASE-A-ATTRIBUTION.md
